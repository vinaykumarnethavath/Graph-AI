[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    api: API endpoint tests
    query: Query engine tests
    edge: Edge case tests
    llm: LLM integration tests
    slow: Slow running tests
    integration: Integration tests
